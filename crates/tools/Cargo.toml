[package]
name = "deeptui-tools"
description = "deeptui's tools as data: name, schema, declared effect and implementation in one value."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
deeptui-core.workspace = true
deeptui-repomap.workspace = true
dirs.workspace = true
serde_json.workspace = true
ignore.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["rt", "process", "time", "io-util", "macros"] }

# bash runs in its own process group; the whole group is killed with it
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
deeptui-testkit.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
