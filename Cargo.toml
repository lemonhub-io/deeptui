[package]
name = "ragent"
version = "0.5.0"
edition = "2021"
description = "Lean Rust coding agent: extreme cost & speed optimization"
license = "Apache-2.0"
keywords = ["ai", "agent", "llm", "cli", "tui"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["macros", "process", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
tokio-stream = "0.1"
unicode-width = "0.2"
ignore = "0.4"
regex = "1"
dirs = "5"
tokio-util = { version = "0.7" }
# self-update only: gzip + raw inflate for the release assets. Pure Rust
# backend, no C toolchain, and nothing is decompressed unless we update.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# `cargo test` needs a runtime + loopback HTTP for the stub server.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
