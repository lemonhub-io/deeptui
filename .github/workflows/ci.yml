name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install mold (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo build --release --locked
      - name: smoke test (help + version)
        run: |
          ${{ matrix.os == 'windows-latest' && './target/release/deeptui.exe --version' || './target/release/deeptui --version' }}
          ${{ matrix.os == 'windows-latest' && './target/release/deeptui.exe --help' || './target/release/deeptui --help' }} > /dev/null
        shell: bash
