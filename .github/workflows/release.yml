name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64 (gnu)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64 (musl, static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - name: macos-x86_64
            os: macos-latest   # arm64 runner, cross-compiles via -arch x86_64
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      # Self-update refuses an asset whose `--version` differs from the tag, so
      # a tag that does not match Cargo.toml would publish an uninstallable
      # release (and every client would see a phantom update forever).
      - name: tag matches the crate version
        shell: bash
        run: |
          set -e
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version $v — bump Cargo.toml before tagging"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install mold + musl toolchain
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mold musl-tools
      - name: install cross toolchain (aarch64-linux)
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -e
          BIN=target/${{ matrix.target }}/release/deeptui
          ART=deeptui-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$ART" artifacts
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "$BIN.exe" "$ART/deeptui.exe"
          else
            cp "$BIN" "$ART/deeptui"
          fi
          cp README.md MIGRATION.md RELEASE_NOTES.md LICENSE "$ART/"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            7z a -tzip "artifacts/$ART.zip" "$ART" >/dev/null
          else
            tar -czf "artifacts/$ART.tar.gz" "$ART"
          fi
          ls artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} -R ${{ github.repository }} --title "DeepTUI ${{ github.ref_name }}" --prerelease=${{ contains(github.ref_name, '-') }} --notes-file RELEASE_NOTES.md dist/*
